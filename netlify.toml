[build]
  command = "rm -rf node_modules && npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Il service worker va sempre ricontrollato, così gli aggiornamenti arrivano subito.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache"

# I file in /assets/ hanno l'hash nel nome: non cambiano mai, si possono tenere per sempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
